<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BookSwap Hub | Login / Register</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="login.css" />
  <link rel="stylesheet" href="animations.css">
  <link rel="stylesheet" href="enhancements.css">

    <!-- Page Transition Loader -->
    <link rel="stylesheet" href="page-transition.css">
    <script src="page-transition.js"></script>
</head>

<body>

  <!-- ================= AUTH PAGE CONTENT ================= -->
  <div class="page">
    <div class="right-form">

      <!--  SINGLE TOGGLE BUTTON -->
      <div class="switch-one">
        <button type="button" class="toggle-btn" id="toggleAuth">
          Login / Register
        </button>
      </div>

      <!-- ================= FLIP CARD (Login/Register) ================= -->
      <div class="card" id="flipCard" data-animate="zoom-in">
        <div class="card-inner">

          <!-- FRONT SIDE: LOGIN -->
          <div class="card-face front">
            <h2>Welcome Back </h2>
            <p>Login to continue your book journey.</p>

            <form id="loginForm">
              <div class="input-box">
                <label>Email</label>
                <input id="loginEmail" type="email" placeholder="example@gmail.com" required>
              </div>

              <div class="input-box">
                <label>Password</label>
                <input id="loginPassword" type="password" placeholder="Enter password" required>
              </div>

              <div class="extras">
                <label class="remember">
                  <input type="checkbox">
                  <span>Remember me</span>
                </label>

                <a href="#" onclick="showForgotPassword(); return false;">Forgot password?</a>
              </div>

                <button class="btn" id="loginBtn" type="submit">Login</button>

                <p id="loginMessage" class="auth-message" aria-live="polite"></p>

              <p class="toggle-text">Don't have an account? <a href="#" class="toggle-link"
                  onclick="document.getElementById('flipCard').classList.add('flipped'); return false;">Register</a></p>
            </form>
          </div>

          <!-- BACK SIDE: REGISTER -->
          <div class="card-face back">
            <h2>Create Account </h2>
            <p>Join BookSwap Hub in few seconds.</p>

            <form id="registerForm">
              <div class="input-box">
                <label>Full Name</label>
                <input id="registerName" type="text" placeholder="Your full name" required>
              </div>

              <div class="input-box">
                <label>Email</label>
                <input id="registerEmail" type="email" placeholder="example@gmail.com" required>
              </div>

              <div class="input-box">
                <label>Phone Number</label>
                <input id="registerPhone" type="tel" placeholder="9876543210" pattern="[0-9]{10}" required>
              </div>

              <div class="input-box">
                <label>Create Password</label>
                <input id="registerPassword" type="password" placeholder="Minimum 6 characters" minlength="6" required>
              </div>

              <button class="btn" id="registerBtn" type="submit">Register</button>

              <p id="registerMessage" class="auth-message" aria-live="polite"></p>

              <p class="toggle-text">Already have an account? <a href="#" class="toggle-link"
                  onclick="document.getElementById('flipCard').classList.remove('flipped'); return false;">Login</a></p>
            </form>
          </div>

        </div>
      </div>

    </div>
  </div>

  <!-- ================= FORGOT PASSWORD MODAL ================= -->
  <div class="forgot-modal-overlay" id="forgotModal">
    <div class="forgot-modal">
      <button class="forgot-close" onclick="hideForgotPassword()">&times;</button>
      <h2><i class="fas fa-key"></i> Reset Password</h2>
      <p>Enter your email address and we'll send you a link to reset your password.</p>
      
      <form id="forgotForm">
        <div class="input-box">
          <label>Email Address</label>
          <input id="forgotEmail" type="email" placeholder="your@email.com" required>
        </div>
        
        <button class="btn" id="forgotBtn" type="submit">
          <i class="fas fa-paper-plane"></i> Send Reset Link
        </button>
        
        <p id="forgotMessage" class="auth-message" aria-live="polite"></p>
      </form>
      
      <p class="forgot-back">
        <a href="#" onclick="hideForgotPassword(); return false;">
          <i class="fas fa-arrow-left"></i> Back to Login
        </a>
      </p>
    </div>
  </div>

  <!-- ================= AUTH LOGIC (Flip Card) ================= -->
  <script>
    // Backend API server URL
    const API_BASE = '';
    
    // ===== DOM ELEMENTS =====
    const flipCard = document.getElementById("flipCard");
    const toggleAuth = document.getElementById("toggleAuth");
    const loginForm = document.getElementById('loginForm');
    const registerForm = document.getElementById('registerForm');
    const loginMessage = document.getElementById('loginMessage');
    const registerMessage = document.getElementById('registerMessage');
    const loginBtn = document.getElementById('loginBtn');
    const registerBtn = document.getElementById('registerBtn');

    /**
     * Display message (error or success) in authentication UI
     * @param {HTMLElement} el - Message element
     * @param {string} text - Message text to display
     * @param {string} type - 'error' or 'success'
     */
    const setMessage = (el, text, type = 'error') => {
      if (!el) return;
      el.textContent = text || '';
      el.classList.remove('error', 'success');
      if (text) el.classList.add(type);
    };

    /**
     * Save JWT token and user data to browser localStorage for session persistence
     * @param {string} token - JWT auth token (7-day expiry)
     * @param {Object} user - User object with id, name, email
     */
    const saveSession = (token, user) => {
      console.log('[Login] Saving session - user:', user);
      localStorage.setItem('authToken', token);
      localStorage.setItem('authUser', JSON.stringify(user));
      console.log('[Login] Session saved - token:', token.substring(0, 20) + '..., userName:', user.name);
    };

    // ===== AUTHENTICATION HANDLER =====
    /**
     * Handle login or register request
     * Posts credentials to backend, saves JWT token and user data on success
     * @param {string} url - Backend endpoint (/api/auth/login or /api/auth/register)
     * @param {Object} payload - Form data (email, password, etc.)
     * @param {HTMLElement} button - Submit button to disable during request
     * @param {HTMLElement} messageEl - Element to display success/error message
     * @param {string} successText - Text to show on successful authentication
     */
    const handleAuth = async (url, payload, button, messageEl, successText) => {
      setMessage(messageEl, '');
      const original = button.textContent;
      button.disabled = true;
      button.textContent = 'Please wait...';

      try {
        console.log('[Login] Auth request:', url);
        const res = await fetch(`${API_BASE}${url}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const data = await res.json();
        console.log('[Login] Auth response - status:', res.status, 'data keys:', Object.keys(data));
        
        if (!res.ok) {
          throw new Error(data.error || 'Authentication failed');
        }

        console.log('[Login] Auth successful, saving session...');
        saveSession(data.token, data.user);
        console.log('[Login] Session saved, showing success message and redirecting...');
        setMessage(messageEl, successText, 'success');
        setTimeout(() => {
          console.log('[Login] Redirecting to home.html');
          window.location.href = 'home.html';
        }, 700);
      } catch (err) {
        console.error('[Login] Auth error:', err.message);
        setMessage(messageEl, err.message || 'Something went wrong.');
      } finally {
        button.disabled = false;
        button.textContent = original;
      }
    };

    toggleAuth.addEventListener("click", () => {
      flipCard.classList.toggle("flipped");
    });

    window.addEventListener("load", () => {
      if (window.location.hash === "#register") {
        flipCard.classList.add("flipped");
      } else {
        flipCard.classList.remove("flipped");
      }
    });

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value;

      await handleAuth(
        '/api/auth/login',
        { email, password },
        loginBtn,
        loginMessage,
        'Login successful. Redirecting...'
      );
    });

    registerForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = document.getElementById('registerName').value.trim();
      const email = document.getElementById('registerEmail').value.trim();
      const password = document.getElementById('registerPassword').value;

      await handleAuth(
        '/api/auth/register',
        { name, email, password },
        registerBtn,
        registerMessage,
        'Registration successful. Redirecting...'
      );
    });

    // ===== FORGOT PASSWORD FUNCTIONALITY =====
    const forgotModal = document.getElementById('forgotModal');
    const forgotForm = document.getElementById('forgotForm');
    const forgotEmail = document.getElementById('forgotEmail');
    const forgotBtn = document.getElementById('forgotBtn');
    const forgotMessage = document.getElementById('forgotMessage');

    function showForgotPassword() {
      forgotModal.classList.add('active');
      forgotEmail.value = document.getElementById('loginEmail').value || '';
      forgotEmail.focus();
      setMessage(forgotMessage, '');
    }

    function hideForgotPassword() {
      forgotModal.classList.remove('active');
      setMessage(forgotMessage, '');
    }

    // Close modal on overlay click
    forgotModal.addEventListener('click', (e) => {
      if (e.target === forgotModal) {
        hideForgotPassword();
      }
    });

    // Close modal on Escape key
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && forgotModal.classList.contains('active')) {
        hideForgotPassword();
      }
    });

    forgotForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = forgotEmail.value.trim();
      
      if (!email) {
        setMessage(forgotMessage, 'Please enter your email address');
        return;
      }

      const original = forgotBtn.innerHTML;
      forgotBtn.disabled = true;
      forgotBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Sending...';
      setMessage(forgotMessage, '');

      try {
        const res = await fetch(`${API_BASE}/api/auth/forgot-password`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email })
        });

        const data = await res.json();

        if (!res.ok) {
          throw new Error(data.error || 'Failed to send reset email');
        }

        setMessage(forgotMessage, 'Check your email for the reset link!', 'success');
        forgotEmail.value = '';
        
        // Auto close after 3 seconds
        setTimeout(() => {
          hideForgotPassword();
        }, 3000);
      } catch (err) {
        setMessage(forgotMessage, err.message || 'Something went wrong');
      } finally {
        forgotBtn.disabled = false;
        forgotBtn.innerHTML = original;
      }
    });
  </script>

  <script src="animations.js"></script>
  <script src="enhancements.js"></script>
</body>

</html>
